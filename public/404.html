<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada (404) | FLUVO Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #000000;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .glitch {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: clamp(5rem, 15vw, 10rem);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        opacity: 0.15;
      }
      h1 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 700;
        margin: 10px 0;
        letter-spacing: -0.02em;
      }
      p {
        color: rgba(255, 255, 255, 0.45);
        max-width: 440px;
        margin: 0 auto 30px;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #ffffff;
        color: #000000;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 0.9rem;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="glitch">404</div>
    <h1>Página no encontrada</h1>
    <p>El enlace que buscas no existe o ha sido movido. Vuelve al inicio para explorar el sitio completo.</p>
    <a href="./">
      <span>Volver a FLUVO Studio</span>
      <span>&rarr;</span>
    </a>
  </body>
</html>
