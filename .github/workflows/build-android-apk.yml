name: Compilar APK Android Gratuita

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generar APK de FLUVO Studio
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci || npm install

      - name: Compilar Web en Produccion
        run: npm run build

      - name: Sincronizar con Proyecto Android (Capacitor)
        run: npx cap sync android

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Nativo (.apk)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: FLUVO-Studio-Android-v1.0.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
