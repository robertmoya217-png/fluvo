<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Ruta no encontrada | FLUVO</title>
  <meta name="theme-color" content="#08090b" />
  <link rel="icon" type="image/svg+xml" href="./public/logo/isotipo-mono.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08090b;
      --bg-2: #0e1013;
      --ink: #f4f6f8;
      --ink-dim: #9aa4ad;
      --line: rgba(255, 255, 255, .14);
      --accent: #c19a5b;
      --ease: cubic-bezier(.19, 1, .22, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(60% 45% at 50% 42%, rgba(193, 154, 91, .08), transparent 70%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--ink);
      font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .panel {
      max-width: 520px;
      width: 100%;
      padding: clamp(32px, 5vw, 56px);
      border: 1px solid var(--line);
      background: rgba(14, 16, 19, .78);
      backdrop-filter: blur(16px);
    }
    .eyebrow {
      margin: 0 0 1rem;
      font-size: .68rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .code {
      margin: 0;
      font-size: clamp(4.2rem, 12vw, 7rem);
      font-weight: 300;
      letter-spacing: -.03em;
      line-height: 1;
      color: var(--ink);
    }
    h1 {
      margin: 1rem 0 .75rem;
      font-size: clamp(1.35rem, 3vw, 1.9rem);
      font-weight: 400;
      letter-spacing: -.01em;
    }
    p {
      margin: 0 0 2rem;
      color: var(--ink-dim);
      font-size: .95rem;
      line-height: 1.65;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: .9em 1.9em;
      background: var(--ink);
      color: var(--bg);
      text-decoration: none;
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      transition: background .3s var(--ease), color .3s var(--ease);
    }
    .btn:hover {
      background: var(--accent);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">FLUVO.ORG · ERROR 404</p>
    <p class="code">404</p>
    <h1>Ruta no encontrada</h1>
    <p>La dirección solicitada no existe o fue movida. Regresa a la página principal de FLUVO Studio.</p>
    <a class="btn" href="./">Volver al inicio &rarr;</a>
  </main>
</body>
</html>
